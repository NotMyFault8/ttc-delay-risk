x-airflow-common: &airflow-common
  image: ttc-airflow:3.1.5
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:?Set AIRFLOW_POSTGRES_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Only the daily publisher uses this URL; ingestion/demo retain their own storage.
    TTC_PUBLISH_DATABASE_URL: ${TTC_PUBLISH_DATABASE_URL:-}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/project/src:ro
    - ./pyproject.toml:/opt/airflow/project/pyproject.toml:ro
    - airflow-data:/opt/airflow/project/data
    - airflow-logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:?Set AIRFLOW_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 12

  airflow-data-init:
    image: ttc-airflow:3.1.5
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -ec
      - mkdir -p /opt/airflow/project/data /opt/airflow/logs && chown airflow:root /opt/airflow/project/data /opt/airflow/logs
    volumes:
      - airflow-data:/opt/airflow/project/data
      - airflow-logs:/opt/airflow/logs

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-data-init:
        condition: service_completed_successfully
    # Propagate migration failures; UI users are created explicitly by the operator.
    command: db migrate

  airflow-apiserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    command: triggerer

volumes:
  airflow-postgres:
  airflow-data:
  airflow-logs:
