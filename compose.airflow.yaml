x-airflow-image: &airflow-image
# Local development stack only. Airflow and PostgreSQL credentials below are
# intentionally simple local placeholders. The API server binds to loopback;
# replace all credentials and secret keys before any shared or hosted use.
  image: ttc-airflow:3.1.5
  build:
    context: .
    dockerfile: Dockerfile.airflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-data-init:
    <<: *airflow-image
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - mkdir -p /opt/airflow/project/data && chown -R airflow:root /opt/airflow/project/data
    volumes:
      - airflow-data:/opt/airflow/project/data

  airflow-init:
    <<: *airflow-image
    depends_on:
      postgres:
        condition: service_healthy
      airflow-data-init:
        condition: service_completed_successfully
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW__API_AUTH__JWT_SECRET: local-airflow-jwt-signing-key-change-before-deployment
      AIRFLOW__API__SECRET_KEY: local-airflow-web-secret-change-before-deployment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: >-
      bash -c "airflow db migrate && airflow users create --username admin
      --password admin --firstname Air --lastname Flow --role Admin
      --email admin@example.com || true"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml:ro
      - airflow-data:/opt/airflow/project/data

  airflow-apiserver:
    <<: *airflow-image
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-scheduler:
    <<: *airflow-image
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - ./pyproject.toml:/opt/airflow/project/pyproject.toml:ro
      - airflow-data:/opt/airflow/project/data

  airflow-dag-processor:
    <<: *airflow-image
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src:ro
      - airflow-data:/opt/airflow/project/data

  airflow-triggerer:
    <<: *airflow-image
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: triggerer

volumes:
  airflow-postgres:
  airflow-data:
